# 1. APPLICATION NAMING
spring.application.name=secureapi

# 2. DATABASE ROUTING VIA ENVIRONMENT VARIABLES
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# 3. HIBERNATE / JPA DEFENSIVE CONTROLS
# 'update' automatically updates your schema as we write code.
# For production, we will transition this to 'validate' or use migrations.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 4. CUSTOM APP PROPERTIES
app.jwt.secret=${JWT_SECRET}
# Token validity set to 24 hours (in milliseconds)
app.jwt.expiration-ms=86400000
